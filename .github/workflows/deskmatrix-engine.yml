name: DeskMatrix engine development checks
on:
  push:
    branches: [codex/deskmatrix-managed-engine]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint-clang
  status-model:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S tests/deskmatrix -B build/status-tests
      - run: cmake --build build/status-tests --config Release
      - run: ctest --test-dir build/status-tests -C Release --output-on-failure
  windows-core-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true
      - id: dependencies
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.3
          vcpkg-triplet: x64-windows-release
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DSKIP_BUILD_TESTS=ON ${{ steps.dependencies.outputs.vcpkg-cmake-config }}
      - run: cmake --build build --config Release --target deskflow-core -j2
  macos-core-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.3
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DBUILD_OSX_BUNDLE=OFF -DSKIP_BUILD_TESTS=ON
      - run: cmake --build build --config Release --target deskflow-core -j2
  core-build:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 20
    steps:
      - name: Install build dependencies in the clean container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates cmake build-essential ninja-build \
            xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev \
            qt6-base-dev qt6-tools-dev libxkbregistry-dev libxkbcommon-dev \
            libei-dev libportal-dev help2man
      - uses: actions/checkout@v6
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DSKIP_BUILD_TESTS=ON
      - run: cmake --build build --target deskflow-core -j2
      - name: Managed certificate initialization is private and idempotent
        shell: bash
        run: |
          pem="$RUNNER_TEMP/deskmatrix identity/tls/identity.pem"
          QT_QPA_PLATFORM=minimal build/bin/deskflow-core --ensure-certificate "$pem" >certificate-created.json
          grep -Eq '"created":true' certificate-created.json
          grep -Eq '"fingerprintSha256":"[0-9a-f]{64}"' certificate-created.json
          test "$(stat -c '%a' "$pem")" = 600
          QT_QPA_PLATFORM=minimal build/bin/deskflow-core --ensure-certificate "$pem" >certificate-existing.json
          grep -Eq '"created":false' certificate-existing.json
          test "$(sed -n 's/.*"fingerprintSha256":"\([0-9a-f]*\)".*/\1/p' certificate-created.json)" = \
            "$(sed -n 's/.*"fingerprintSha256":"\([0-9a-f]*\)".*/\1/p' certificate-existing.json)"
      - run: cmake -S tests/deskmatrix -B build/status-tests && cmake --build build/status-tests && ctest --test-dir build/status-tests --output-on-failure
      - name: Read-only status fails closed without a running engine
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=minimal build/bin/deskflow-core --status-json >status.json 2>status.err
          result=$?
          set -e
          test "$result" -eq 1
          test ! -s status.json
          grep -q 'IPC unavailable' status.err
