name: DeskMatrix engine development checks
on:
  push:
    branches: [codex/deskmatrix-managed-engine]
permissions:
  contents: read
jobs:
  status-model:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S tests/deskmatrix -B build/status-tests
      - run: cmake --build build/status-tests --config Release
      - run: ctest --test-dir build/status-tests -C Release --output-on-failure
  core-build:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 20
    steps:
      - name: Install build dependencies in the clean container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates cmake build-essential ninja-build \
            xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev \
            qt6-base-dev qt6-tools-dev libxkbregistry-dev libxkbcommon-dev \
            libei-dev libportal-dev help2man
      - uses: actions/checkout@v6
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=OFF -DSKIP_BUILD_TESTS=ON
      - run: cmake --build build --target deskflow-core -j2
      - run: cmake -S tests/deskmatrix -B build/status-tests && cmake --build build/status-tests && ctest --test-dir build/status-tests --output-on-failure
      - name: Read-only status fails closed without a running engine
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=minimal build/bin/deskflow-core --status-json >status.json 2>status.err
          result=$?
          set -e
          test "$result" -eq 1
          test ! -s status.json
          grep -q 'IPC unavailable' status.err
